[project]
name = "spsc-ring-threadsafe"
authors = [
    {name = "Elias de Jong", email = "elias@fastserial.com"},
]
version = "0.1.1"
description = "A thread-safe SPSC queue, implemented on a ring buffer written in C"
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.14"
classifiers = [
	"Development Status :: 4 - Beta",
	"Intended Audience :: Developers",
	"Programming Language :: C",
	"Programming Language :: Python :: 3",
	"Programming Language :: Python :: Implementation :: CPython",
	"Programming Language :: Python :: Free Threading",
]
dependencies = []


[project.urls]
Source = "https://github.com/eliasdejong/spsc-ring-threadsafe"


[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"


[tool.setuptools]
ext-modules = [
	{name = "spsc_ring_threadsafe", sources = ["src/spsc_ring_threadsafe.c"]}
]


[tool.cibuildwheel]
test-command = "python -m unittest discover -s {project}/tests"
skip = "*musllinux* *i686* *win32*"
build = "cp314*"

[tool.cibuildwheel.linux]
archs = ["x86_64", "aarch64"]